services:
  reverse-everything:
    build:
      context: .
      dockerfile: Dockerfile
    image: reverse-everything:0.0.7
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      RE_HOST: 0.0.0.0
      RE_ALLOW_REMOTE: "true"
      RE_ALLOWED_HOSTS: "127.0.0.1:4173,localhost:4173"
      RE_PORT: "4173"
      RE_DATA_DIR: /data
      RE_RESOURCE_DIR: /app
      RE_MAX_UPLOAD_MB: "100"
      RE_TASK_TIMEOUT_MS: "300000"
      # Optional Linux/Docker allowlist (':' separator); use container paths.
      # RE_GAME_ROOTS: "/games/owned-fps:/games/owned-rpg"
      # Optional Linux/Docker allowlist for read-only legacy software/data paths.
      # RE_LEGACY_ROOTS: "/legacy:/retained-data"
    volumes:
      - reverse-everything-data:/data
      # Optional: mount only lawfully retained directories read-only.
      # - /absolute/host/games:/games:ro
      # - /absolute/host/legacy:/legacy:ro
      # - /absolute/host/retained-data:/retained-data:ro
    restart: unless-stopped
    init: true
volumes:
  reverse-everything-data:
