services:
  reverse-everything:
    build:
      context: .
      dockerfile: Dockerfile
    image: reverse-everything:0.0.1
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      RE_HOST: 0.0.0.0
      RE_PORT: "4173"
      RE_DATA_DIR: /data
      RE_MAX_UPLOAD_MB: "100"
      RE_TASK_TIMEOUT_MS: "300000"
    volumes:
      - reverse-everything-data:/data
    restart: unless-stopped
    init: true
volumes:
  reverse-everything-data:
