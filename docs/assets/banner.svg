<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 512" role="img" aria-labelledby="title desc">
  <title id="title">逆向万物 Reverse Everything</title>
  <desc id="desc">深蓝紫色科技横幅，包含芯片、网页、协议、硬件与固件分析节点</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080f22"/><stop offset="0.55" stop-color="#111a3d"/><stop offset="1" stop-color="#2b1551"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54e1ff"/><stop offset="1" stop-color="#b39bff"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#8ba7ff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1536" height="512" fill="url(#bg)"/>
  <rect width="1536" height="512" fill="url(#grid)"/>
  <g transform="translate(1020 70)" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="120" y="120" width="180" height="180" rx="30"/>
    <path d="M170 120V80h80v40M170 300v40h80v-40M120 170H80v80h40M300 170h40v80h-40"/>
    <path d="M170 210h80M210 170v80"/>
    <path d="M80 210H20M420 210h60M210 20V0M210 420v40"/>
    <circle cx="20" cy="210" r="10" fill="#54e1ff"/><circle cx="480" cy="210" r="10" fill="#b39bff"/>
    <circle cx="210" cy="20" r="10" fill="#54e1ff"/><circle cx="210" cy="420" r="10" fill="#b39bff"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#f4f7ff">
    <text x="96" y="176" font-size="72" font-weight="700">逆向万物</text>
    <text x="98" y="244" font-size="36" font-weight="600" fill="url(#accent)">Reverse Everything</text>
    <text x="98" y="316" font-size="25" fill="#c6d2f5">软件 · 网页 · 协议 · 硬件 · 固件 · 安全</text>
    <text x="98" y="360" font-size="21" fill="#91a4cf">以可验证证据理解系统，重建部分兼容能力</text>
  </g>
</svg>
