name: Release v0.0.3 candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable branch or commit SHA to test as the release candidate
        required: true
        default: main
        type: string
      publish:
        description: Publish only after every candidate job and manual approval succeeds
        required: false
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH v0.0.3 to authorize annotated tag and Release creation
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-v0.0.3
  cancel-in-progress: false

jobs:
  candidate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          commit="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.0.3"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Candidate source: $commit ($version)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run licenses
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run test:e2e
      - run: node scripts/generate-openapi.mjs
      - run: node scripts/generate-sbom.mjs
      - run: node scripts/validate-skill.mjs
      - run: node scripts/package-cli.mjs
      - run: node scripts/package-server.mjs
      - run: node scripts/package-skill.mjs
      - name: Audit final standalone dependency trees
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --prefix dist/release/cli
          npm audit --omit=dev --prefix dist/release/server
      - name: Assemble Linux candidate assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist/release
          cp "docs/api/openapi-v$version.json" dist/release/
          test -f "dist/release/reverse-everything-cli-$version.tgz"
          test -f "dist/release/reverse-everything-server-$version.tar.gz"
          test -f "dist/release/reverse-everything-skill-$version.zip"
      - name: Clean CLI and server install smoke
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm install -g "./dist/release/reverse-everything-cli-$version.tgz" --no-audit --no-fund
          cli_version="$(reverse-everything --version)"
          node -e 'const value=JSON.parse(process.argv[1]);if(value.version!==process.argv[2])process.exit(1)' "$cli_version" "$version"
          reverse-everything --help >/dev/null
          rm -rf /tmp/re-v003-server /tmp/re-v003-data /tmp/re-v003-skill
          mkdir -p /tmp/re-v003-server /tmp/re-v003-skill
          tar -xzf "dist/release/reverse-everything-server-$version.tar.gz" -C /tmp/re-v003-server
          unzip -q "dist/release/reverse-everything-skill-$version.zip" -d /tmp/re-v003-skill
          cd /tmp/re-v003-server/server
          npm ci --omit=dev --no-audit --no-fund
          setsid env RE_DATA_DIR=/tmp/re-v003-data npm start >/tmp/re-v003-server.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/api/health >/tmp/re-v003-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/re-v003-server.log; exit 1; fi
          token="$(cat /tmp/re-v003-data/local-token)"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:4173/api/openapi.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const value=JSON.parse(s);if(value.info.version!==process.argv[1])process.exit(1)})' "$version"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:4173/api/demo/trace >/dev/null
          RE_API_URL=http://127.0.0.1:4173 node /tmp/re-v003-skill/reverse-everything/scripts/check-environment.mjs | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const value=JSON.parse(s);if(value.api?.ok!==true)process.exit(1)})'
          RE_API_URL=http://127.0.0.1:4173 RE_DATA_DIR=/tmp/re-v003-data reverse-everything capabilities >/dev/null
      - name: Docker image build and health evidence
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse HEAD)"
          docker build -t "reverse-everything:$version" .
          docker run -d --name re-v003-docker -p 127.0.0.1:4173:4173 -e RE_ALLOW_REMOTE=true -e RE_ALLOWED_HOSTS=127.0.0.1:4173 "reverse-everything:$version"
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs re-v003-docker; docker rm -f re-v003-docker; exit 1; fi
          image_id="$(docker image inspect --format '{{.Id}}' "reverse-everything:$version")"
          node -e 'require("node:fs").writeFileSync("dist/release/docker-image.json",JSON.stringify({image:process.argv[1],imageId:process.argv[2],commit:process.argv[3],version:process.argv[4]},null,2)+"\n")' "reverse-everything:$version" "$image_id" "$commit" "$version"
          docker rm -f re-v003-docker
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-linux
          if-no-files-found: error
          path: |
            dist/release/*.tgz
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.json

  candidate-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          commit="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.0.3"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: node scripts/package-runtime.mjs
      - run: npm run dist -w @reverse/desktop
      - name: Normalize portable name
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Rename-Item "dist/desktop/Reverse-Everything-Setup-$version-win-x64.zip" "dist/desktop/Reverse-Everything-Portable-$version-win-x64.zip"
      - name: Silent install smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $installer = Get-ChildItem dist/desktop/*.exe | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP\re-v003-install"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$dest" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $exe = Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable not found' }
          $env:RE_DATA_DIR = "$env:RUNNER_TEMP\re-v003-data"
          $env:RE_SMOKE_OUTPUT = "$env:RUNNER_TEMP\re-v003-smoke.json"
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop smoke exited $($process.ExitCode)" }
          $result = Get-Content $env:RE_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.version -ne $version) { throw 'Desktop smoke result mismatch' }
      - name: Portable smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $zip = Get-ChildItem dist/desktop/*.zip | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP\re-v003-portable"
          Expand-Archive $zip.FullName -DestinationPath $dest
          $exe = Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $exe) { throw 'Portable executable not found' }
          $env:RE_DATA_DIR = "$env:RUNNER_TEMP\re-v003-portable-data"
          $env:RE_SMOKE_OUTPUT = "$env:RUNNER_TEMP\re-v003-portable-smoke.json"
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Portable smoke exited $($process.ExitCode)" }
          $result = Get-Content $env:RE_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.version -ne $version) { throw 'Portable smoke result mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-windows
          if-no-files-found: error
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip

  candidate-acceptance:
    needs: [candidate-linux, candidate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate-linux.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          linux="${{ needs.candidate-linux.outputs.commit }}"
          windows="${{ needs.candidate-windows.outputs.commit }}"
          commit="$(git rev-parse HEAD)"
          test "$linux" = "$windows"
          test "$commit" = "$linux"
          test -z "$(git status --porcelain)"
          test "$(node -p "require('./package.json').version")" = "0.0.3"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: dist/release
          merge-multiple: true
      - name: Generate candidate acceptance and provenance
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          commit="${{ needs.candidate-linux.outputs.commit }}"
          version="$(node -p "require('./package.json').version")"
          for asset in \
            "reverse-everything-cli-$version.tgz" \
            "reverse-everything-server-$version.tar.gz" \
            "reverse-everything-skill-$version.zip" \
            "Reverse-Everything-Setup-$version-win-x64.exe" \
            "Reverse-Everything-Portable-$version-win-x64.zip" \
            "openapi-v$version.json" \
            "SBOM-v$version.json" \
            "docker-image.json"; do
            test -s "dist/release/$asset" || { echo "Missing candidate asset: $asset" >&2; exit 1; }
          done
          node -e 'require("node:fs").writeFileSync("dist/release/ACCEPTANCE.json",JSON.stringify({accepted:true,commit:process.argv[1],version:process.argv[2],checks:["linux-quality","clean-cli-server-skill-smoke","docker-health","windows-install-smoke","windows-portable-smoke","required-assets-present"]},null,2)+"\n")' "$commit" "$version"
          node scripts/release-provenance.mjs generate --dir dist/release --commit "$commit" --ref "$CANDIDATE_REF" --version "$version" --run-id "${{ github.run_id }}"
          node scripts/release-provenance.mjs verify --dir dist/release --tag "v$version" --version "$version" --tag-commit "$commit" --skip-tag-check
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-v0.0.3
          if-no-files-found: error
          path: |
            dist/release/*.tgz
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.json
            dist/release/SHA256SUMS.txt
      - name: Summarize accepted candidate
        shell: bash
        run: |
          {
            echo '## Accepted v0.0.3 candidate'
            echo "- Commit: \`${{ needs.candidate-linux.outputs.commit }}\`"
            echo '- Linux quality/package/Skill/Docker: passed'
            echo '- Windows installer and portable smoke: passed'
            echo '- BUILD-INFO, RELEASE-MANIFEST and SHA256SUMS: verified'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.publish && inputs.confirmation == 'PUBLISH v0.0.3' }}
    needs: candidate-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-v003
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate-acceptance.outputs.commit }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: candidate-v0.0.3
          path: dist/release
      - name: Verify immutable candidate and annotated tag
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ needs.candidate-acceptance.outputs.commit }}"
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$candidate"
          test -z "$(git status --porcelain)"
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.0.3"
          created_tag=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify 'refs/tags/v0.0.3^{commit}' >/dev/null; then
            test "$(git cat-file -t refs/tags/v0.0.3)" = "tag"
            tag_commit="$(git rev-parse 'v0.0.3^{commit}')"
          else
            git tag -a v0.0.3 "$candidate" -m 'Reverse Everything v0.0.3'
            tag_commit="$(git rev-parse 'v0.0.3^{commit}')"
            created_tag=1
          fi
          test "$tag_commit" = "$candidate"
          test "$tag_commit" = "$commit"
          node scripts/release-provenance.mjs verify --dir dist/release --tag v0.0.3 --version "$version"
          if [ "$created_tag" = 1 ]; then git push origin refs/tags/v0.0.3; fi
          git fetch origin tag v0.0.3
          remote_commit="$(git rev-parse 'refs/tags/v0.0.3^{commit}')"
          test "$remote_commit" = "$candidate"
          if gh release view v0.0.3 >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing v0.0.3 Release'
            exit 1
          fi
      - name: Create stable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync("dist/release/BUILD-INFO.json","utf8"));const m=JSON.parse(fs.readFileSync("dist/release/RELEASE-MANIFEST.json","utf8"));fs.writeFileSync("/tmp/re-v003-release-notes.md","# 逆向万物 v"+b.version+"\n\n- Commit: `"+b.commit+"`\n- Ref: `"+b.ref+"`\n- Assets: "+m.assets.length+"\n- Verify: download SHA256SUMS.txt and run sha256sum -c SHA256SUMS.txt\n")'
          gh release create v0.0.3 --verify-tag --latest --title '逆向万物 v0.0.3' --notes-file /tmp/re-v003-release-notes.md dist/release/*
