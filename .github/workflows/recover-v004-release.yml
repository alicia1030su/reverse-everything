name: Recover v004 release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH v0.0.4 to recover the accepted candidate release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-recovery-v004
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirmation == 'PUBLISH v0.0.4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download accepted candidate from the original release run
        uses: actions/download-artifact@v4
        with:
          name: candidate-0.0.4
          path: dist/release
          github-token: ${{ github.token }}
          repository: alicia1030su/reverse-everything
          run-id: 45611613592
      - name: Verify candidate provenance and Draft identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: cfb19bbfa23d67ed23b660c793602bcadc1cffa6
          TAG: v0.0.4
          VERSION: 0.0.4
          REPO: alicia1030su/reverse-everything
        run: |
          set -euo pipefail
          node scripts/release-provenance.mjs verify \
            --dir dist/release --tag "$TAG" --version "$VERSION" \
            --tag-commit "$COMMIT" --skip-tag-check
          node scripts/release-atomic.mjs ensure-draft \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$REPO"
      - name: Update Draft release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-v004-notes.md <<'EOF'
          ## 逆向万物 v0.0.4

          - Frozen commit: `cfb19bbfa23d67ed23b660c793602bcadc1cffa6`
          - Candidate workflow: `45611613592`
          - Linux quality gates, clean CLI/Server/Skill smoke and Docker health: passed
          - Windows silent install and Portable smoke: passed
          - Ghidra 12.2 and JADX 1.5.3 official-tool known-answer CI: passed
          - Independent acceptance, BUILD-INFO, RELEASE-MANIFEST and SHA256SUMS: verified

          ### 主要更新

          - 新增 hardware/firmware 离线分析入口与统一 adapter 边界。
          - Web 控制台覆盖 website/software/android/game/network/security/usb/firmware/board 九类入口。
          - 完善缓存、保留、删除、桌面资源指标与 Windows 文件安全语义。
          - 更新 CLI、MCP、Skill、OpenAPI、桌面安装包及中英文文档。

          ### 安全与验证边界

          - 仅用于合法授权目标；不绕过登录、验证码、付费、DRM 或反作弊。
          - 未获得物理设备、实时捕获、驱动安装或刷写授权，相关能力不标为已验证。
          - Ghidra/JADX 仅在官方 CI 的 PE/ELF/APK 已知答案范围内视为已验证。
          - 不宣称完整网站克隆、原始游戏服务端恢复或自动漏洞利用。

          下载 `SHA256SUMS.txt` 后运行 `sha256sum -c SHA256SUMS.txt` 验证资产。

          release-provenance-sha256:ccab9042c24e6d7e278b566e316693950367f89ec6400dc4663233778fa83fe0
          EOF
          gh api -X PATCH repos/alicia1030su/reverse-everything/releases/458077214 \
            -F body=@/tmp/release-v004-notes.md >/dev/null
      - name: Upload missing Draft assets without overwriting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: cfb19bbfa23d67ed23b660c793602bcadc1cffa6
          TAG: v0.0.4
          REPO: alicia1030su/reverse-everything
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs upload \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$REPO"
      - name: Verify every Draft asset name, size and digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: cfb19bbfa23d67ed23b660c793602bcadc1cffa6
          TAG: v0.0.4
          REPO: alicia1030su/reverse-everything
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs verify-draft \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$REPO"
      - name: Publish stable latest once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: cfb19bbfa23d67ed23b660c793602bcadc1cffa6
          TAG: v0.0.4
          REPO: alicia1030su/reverse-everything
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs publish \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$REPO"
      - name: Re-download public assets and verify checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: cfb19bbfa23d67ed23b660c793602bcadc1cffa6
          TAG: v0.0.4
          REPO: alicia1030su/reverse-everything
        run: |
          set -euo pipefail
          rm -rf /tmp/release-v004-public
          mkdir -p /tmp/release-v004-public
          gh release download "$TAG" --repo "$REPO" --dir /tmp/release-v004-public
          (cd /tmp/release-v004-public && sha256sum -c SHA256SUMS.txt)
          node scripts/release-atomic.mjs verify-draft \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" \
            --json tagName,isDraft,isPrerelease,isLatest,url,publishedAt,assets
