name: Release v009

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create an annotated Tag and publish only after acceptance and asset verification
        required: false
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH v<version> using the version printed by the candidate job
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: release-v009-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          commit="$(git rev-parse HEAD)"
          git fetch origin main
          test "$commit" = "$(git rev-parse origin/main)"
          version="$(node scripts/release-atomic.mjs version --root .)"
          tag="v$version"
          export COMMIT="$commit"
          node scripts/verify-release-workflows.mjs --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --branch main --current-workflow "$WORKFLOW_NAME" --current-run-id "$GITHUB_RUN_ID"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Frozen candidate: $commit ($tag)"

  candidate-linux:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.freeze.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.freeze.outputs.version }}
          EXPECTED_RUN_ID: ${{ needs.freeze.outputs.run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(node scripts/release-atomic.mjs version --root .)" = "$EXPECTED_VERSION"
          test -z "$(git status --porcelain)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install isolated blind-test runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap gcc
      - name: Download and verify official Ghidra
        shell: bash
        run: |
          set -euo pipefail
          archive=ghidra_12.2_PUBLIC_20261016.zip
          curl -fL --retry 3 --connect-timeout 30 --max-time 1800 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$archive" \
            -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum -c -
          mkdir -p .ghidra
          unzip -q "$archive" -d .ghidra
          install="$(find .ghidra -maxdepth 1 -type d -name 'ghidra_12.2_PUBLIC*' -print -quit)"
          test -n "$install"
          echo "RE_GHIDRA_INSTALL_DIR=$GITHUB_WORKSPACE/$install" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run defects:check
      - run: npm run version:check
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run licenses
      - run: npm audit --omit=dev
      - run: npm test
      - name: Require Legacy unit tests
        run: npx vitest run tests/unit/legacy-revival.test.ts --reporter=verbose
      - name: Require anti-template game behavior tests
        run: npx vitest run tests/unit/game-revival.test.ts -t "evidence-driven anti-template acceptance" --reporter=verbose
      - name: Require Schema 7 migration tests
        run: npx vitest run tests/unit/autopilot.test.ts -t "persists task state across SQLite close and reopen" --reporter=verbose
      - name: Require Autopilot core and API integration tests
        run: npx vitest run tests/unit/autopilot.test.ts tests/integration/autopilot-api.test.ts --reporter=verbose
      - name: Require Autopilot Web real API E2E
        run: npm run test:e2e -- tests/e2e/autopilot.spec.ts
      - name: Require MCP stdio and Streamable HTTP transports
        run: npx vitest run tests/integration/platform.test.ts --reporter=verbose
      - name: Generate current-commit original-client game compatibility evidence
        run: npx playwright test tests/e2e/game-compat.spec.ts --output="${{ runner.temp }}/v009-game-compat-evidence" --reporter=line
      - run: node scripts/generate-openapi.mjs
      - run: node scripts/generate-sbom.mjs
      - run: npm run validate:skill
      - run: node scripts/package-cli.mjs
      - run: node scripts/package-server.mjs
      - run: node scripts/package-skill.mjs
      - name: Package demos with current-commit original-client evidence
        env:
          GAME_COMPAT_EVIDENCE_DIR: ${{ runner.temp }}/v009-game-compat-evidence
        run: npm run package:demos
      - name: Require eight-stage real model evidence
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REAL_MODEL_BASE_URL: ${{ vars.REAL_MODEL_BASE_URL }}
          REAL_MODEL_NAME: ${{ vars.REAL_MODEL_NAME }}
        run: |
          set -euo pipefail
          node scripts/validate-v009-real-model.mjs \
            --base-url "${REAL_MODEL_BASE_URL:-https://api.openai.com/v1}" \
            --model "${REAL_MODEL_NAME:-gpt-4o-mini}" \
            --api-key-env OPENAI_API_KEY \
            --program-ir tests/fixtures/program-ir/ghidra-metadata.json \
            --function sum_bytes \
            --output-dir artifacts/v009-real-model
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('artifacts/v009-real-model/real-model-report.json', 'utf8'));
          if (report.status !== 'PASSED' || report.realModel?.realModelCalled !== true || report.realModel.requests.length !== 8) throw new Error('Eight-stage real model evidence is required');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-model-validation
          if-no-files-found: warn
          path: artifacts/v009-real-model
      - name: Require three isolated blind reconstructions
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REAL_MODEL_BASE_URL: ${{ vars.REAL_MODEL_BASE_URL }}
          REAL_MODEL_NAME: ${{ vars.REAL_MODEL_NAME }}
        run: |
          set -euo pipefail
          for case_id in alpha beta gamma; do
            node scripts/reconstruct-blind-with-model.mjs \
              --case "$case_id" \
              --base-url "${REAL_MODEL_BASE_URL:-https://api.openai.com/v1}" \
              --model "${REAL_MODEL_NAME:-gpt-4o-mini}" \
              --api-key-env OPENAI_API_KEY \
              --confirm-isolated \
              --output-dir "artifacts/blind-$case_id"
            cp "tests/fixtures/blind/libcase_$case_id.so" "artifacts/blind-$case_id/binary.so"
          done
      - name: Verify real two-version Binary Diff
        run: node scripts/verify-binary-diff.mjs
        env:
          BINARY_DIFF_OUTPUT_DIR: ${{ github.workspace }}/artifacts/binary-diff
      - uses: actions/upload-artifact@v7
        with:
          name: v009-evidence
          if-no-files-found: error
          path: |
            artifacts/v009-real-model
            artifacts/blind-alpha
            artifacts/blind-beta
            artifacts/blind-gamma
            artifacts/binary-diff
      - name: Audit final standalone dependency trees
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --prefix dist/release/cli
          npm audit --omit=dev --prefix dist/release/server
      - name: Assemble Linux candidate assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/release-atomic.mjs version --root .)"
          mkdir -p dist/release
          cp "docs/api/openapi-v$version.json" dist/release/
          test -s "dist/release/reverse-everything-cli-$version.tgz"
          test -s "dist/release/reverse-everything-server-$version.tar.gz"
          test -s "dist/release/reverse-everything-skill-$version.zip"
          test -s "dist/release/SBOM-v$version.json"
      - name: Clean CLI, server and Skill smoke
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/release-atomic.mjs version --root .)"
          npm install -g "./dist/release/reverse-everything-cli-$version.tgz" --no-audit --no-fund
          cli_version="$(reverse-everything --version)"
          node -e 'const value=JSON.parse(process.argv[1]);if(value.version!==process.argv[2])process.exit(1)' "$cli_version" "$version"
          reverse-everything --help >/dev/null
          rm -rf /tmp/re-release-server /tmp/re-release-data /tmp/re-release-skill
          mkdir -p /tmp/re-release-server /tmp/re-release-skill
          tar -xzf "dist/release/reverse-everything-server-$version.tar.gz" -C /tmp/re-release-server
          test -s /tmp/re-release-server/server/scripts/ghidra-analyze-headless.mjs
          cmp scripts/ghidra-analyze-headless.mjs /tmp/re-release-server/server/scripts/ghidra-analyze-headless.mjs
          unzip -q "dist/release/reverse-everything-skill-$version.zip" -d /tmp/re-release-skill
          cd /tmp/re-release-server/server
          npm ci --omit=dev --no-audit --no-fund
          setsid env RE_DATA_DIR=/tmp/re-release-data npm start >/tmp/re-release-server.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/re-release-server.log; exit 1; fi
          token="$(cat /tmp/re-release-data/local-token)"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:4173/api/openapi.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const value=JSON.parse(s);if(value.info.version!==process.argv[1])process.exit(1)})' "$version"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:4173/api/demo/trace >/dev/null
          RE_API_URL=http://127.0.0.1:4173 node /tmp/re-release-skill/reverse-everything/scripts/check-environment.mjs | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const value=JSON.parse(s);if(value.api?.ok!==true)process.exit(1)})'
          RE_API_URL=http://127.0.0.1:4173 RE_DATA_DIR=/tmp/re-release-data reverse-everything capabilities >/dev/null
      - name: Docker image build and health evidence
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/release-atomic.mjs version --root .)"
          commit="$(git rev-parse HEAD)"
          docker build -t "reverse-everything:$version" .
          docker run -d --name re-release-docker -p 127.0.0.1:4173:4173 -e RE_ALLOW_REMOTE=true -e RE_ALLOWED_HOSTS=127.0.0.1:4173 "reverse-everything:$version"
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs re-release-docker; docker rm -f re-release-docker; exit 1; fi
          image_id="$(docker image inspect --format '{{.Id}}' "reverse-everything:$version")"
          node -e 'require("node:fs").writeFileSync("dist/release/docker-image.json",JSON.stringify({image:process.argv[1],imageId:process.argv[2],commit:process.argv[3],version:process.argv[4]},null,2)+"\n")' "reverse-everything:$version" "$image_id" "$commit" "$version"
          docker rm -f re-release-docker
      - name: Validate real FPS and RPG Docker deployments
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.freeze.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(node scripts/release-atomic.mjs version --root .)" = "$EXPECTED_VERSION"
          mkdir -p dist/game-docker
          node scripts/validate-game-docker.mjs --genre fps --output dist/game-docker/fps
          node scripts/validate-game-docker.mjs --genre rpg --output dist/game-docker/rpg
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const reports = {};
          for (const genre of ['fps', 'rpg']) {
            const report = JSON.parse(await readFile(`dist/game-docker/${genre}/docker-validation.json`, 'utf8'));
            if (report.targetEvidence?.behavior !== 'VERIFIED' || report.targetEvidence?.originalClient !== 'UNKNOWN' || report.targetEvidence?.protocol !== 'UNKNOWN') throw new Error(`${genre} Docker anti-template evidence must verify behavior while keeping original client and protocol UNKNOWN`);
            if (!report.clients.every(client => client.kind === 'internal-protocol-client' && client.count > 0)) throw new Error(`${genre} Docker anti-template evidence must use only internal protocol clients`);
            if (report.clients.some(client => client.kind === 'original-game-client')) throw new Error(`${genre} Docker template evidence must not claim an original game client`);
            reports[genre] = report;
          }
          await writeFile('dist/game-docker/docker-validation.json', JSON.stringify({ schemaVersion: 1, commit: process.env.EXPECTED_COMMIT, version: process.env.EXPECTED_VERSION, reports }, null, 2) + '\n');
          NODE
      - name: Independently verify real FPS and RPG Docker evidence
        shell: bash
        run: |
          set -euo pipefail
          for genre in fps rpg; do
            node scripts/verify-game-docker-evidence.mjs \
              --genre "$genre" \
              --report "dist/game-docker/$genre/docker-validation.json" \
              --evidence "dist/game-docker/$genre/docker-deployment-evidence.json" \
              --sums "dist/game-docker/$genre/SHA256SUMS.txt"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: docker-validation
          if-no-files-found: error
          path: |
            dist/game-docker/docker-validation.json
            dist/game-docker/*/docker-validation.json
            dist/game-docker/*/docker-deployment-evidence.json
            dist/game-docker/*/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-linux
          if-no-files-found: error
          path: |
            dist/release/*.tgz
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.json

  candidate-game-docker:
    needs: [freeze, candidate-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.commit }}
          persist-credentials: false
      - id: meta
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.freeze.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.freeze.outputs.version }}
          EXPECTED_RUN_ID: ${{ needs.freeze.outputs.run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(node scripts/release-atomic.mjs version --root .)" = "$EXPECTED_VERSION"
          test -z "$(git status --porcelain)"
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: docker-validation
          path: dist/game-docker
      - name: Require real FPS and RPG Docker evidence
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.freeze.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const summary = JSON.parse(await readFile('dist/game-docker/docker-validation.json', 'utf8'));
          if (summary.commit !== process.env.EXPECTED_COMMIT || summary.version !== process.env.EXPECTED_VERSION) throw new Error('Docker evidence identity mismatch');
          for (const genre of ['fps', 'rpg']) {
            const report = JSON.parse(await readFile(`dist/game-docker/${genre}/docker-validation.json`, 'utf8'));
            if (report.targetEvidence?.behavior !== 'VERIFIED' || report.targetEvidence?.originalClient !== 'UNKNOWN' || report.targetEvidence?.protocol !== 'UNKNOWN') throw new Error(`${genre} Docker anti-template evidence must verify behavior while keeping original client and protocol UNKNOWN`);
            if (!report.clients.every(client => client.kind === 'internal-protocol-client' && client.count > 0)) throw new Error(`${genre} Docker anti-template evidence must use only internal protocol clients`);
            if (report.clients.some(client => client.kind === 'original-game-client')) throw new Error(`${genre} Docker template evidence must not claim an original game client`);
            if (JSON.stringify(summary.reports?.[genre]) !== JSON.stringify(report)) throw new Error(`${genre} Docker summary mismatch`);
          }
          NODE
          for genre in fps rpg; do
            node scripts/verify-game-docker-evidence.mjs \
              --genre "$genre" \
              --report "dist/game-docker/$genre/docker-validation.json" \
              --evidence "dist/game-docker/$genre/docker-deployment-evidence.json" \
              --sums "dist/game-docker/$genre/SHA256SUMS.txt"
          done

  candidate-windows:
    needs: freeze
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.freeze.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.freeze.outputs.version }}
          EXPECTED_RUN_ID: ${{ needs.freeze.outputs.run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(node scripts/release-atomic.mjs version --root .)" = "$EXPECTED_VERSION"
          test -z "$(git status --porcelain)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: node scripts/package-runtime.mjs
      - name: Verify runtime Ghidra launcher layouts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = (Get-FileHash 'scripts/ghidra-analyze-headless.mjs' -Algorithm SHA256).Hash
          foreach ($relative in @('dist/desktop-runtime/scripts/ghidra-analyze-headless.mjs', 'dist/desktop-runtime/node_modules/scripts/ghidra-analyze-headless.mjs')) {
            if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) { throw "Missing runtime Ghidra launcher: $relative" }
            if ((Get-FileHash $relative -Algorithm SHA256).Hash -ne $expected) { throw "Runtime Ghidra launcher mismatch: $relative" }
          }
      - run: npm run dist -w @reverse/desktop
      - name: Normalize portable name
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node scripts/release-atomic.mjs version --root .
          $source = Join-Path (Get-Location) "dist/desktop/Reverse-Everything-Setup-$version-win-x64.zip"
          $target = Join-Path (Get-Location) "dist/desktop/Reverse-Everything-Portable-$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Portable source not found: $source" }
          if (Test-Path -LiteralPath $target) { throw "Portable target already exists: $target" }
          [System.IO.File]::Move($source, $target)
      - name: Upgrade v0.0.8 installer and preserve user data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node scripts/release-atomic.mjs version --root .
          if ($version -ne '0.0.9') { throw "Unexpected candidate version: $version" }
          $dest = Join-Path $env:RUNNER_TEMP 're-release-upgrade'
          $dataDir = Join-Path $env:RUNNER_TEMP 're-release-upgrade-data'
          $downloads = Join-Path $env:RUNNER_TEMP 're-v008-upgrade'
          foreach ($path in @($dest, $dataDir, $downloads)) { if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force } }
          New-Item -ItemType Directory -Path $dataDir, $downloads -Force | Out-Null
          gh release download v0.0.8 --repo $env:GITHUB_REPOSITORY --pattern 'Reverse-Everything-Setup-0.0.8-win-x64.exe' --dir $downloads --clobber
          $previousInstaller = Get-ChildItem $downloads -Filter '*.exe' | Select-Object -First 1
          if (-not $previousInstaller) { throw 'v0.0.8 installer not found' }
          $process = Start-Process -FilePath $previousInstaller.FullName -ArgumentList '/S',"/D=$dest" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "v0.0.8 installer exited $($process.ExitCode)" }
          $previousExe = Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $previousExe) { throw 'v0.0.8 installed executable not found' }
          $env:RE_DATA_DIR = $dataDir
          $env:RE_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 're-v008-smoke.json'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $previousExe.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "v0.0.8 desktop smoke exited $($process.ExitCode)" }
          $previousResult = Get-Content $env:RE_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (-not $previousResult.ok -or $previousResult.version -ne '0.0.8') { throw 'v0.0.8 baseline smoke result mismatch' }
          $database = Join-Path $dataDir 'reverse-everything.sqlite'
          $sentinel = Join-Path $dataDir 'v008-user-data.txt'
          [System.IO.File]::WriteAllText($sentinel, 'preserve-v008-user-data')
          $seed = @'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync(process.argv[2]);
          const version = Number(db.prepare('PRAGMA user_version').get().user_version);
          if (version !== 7) throw new Error(`Expected v0.0.8 Schema 7, got ${version}`);
          db.prepare('INSERT INTO projects (id,name,kind,target,authorization_confirmed,created_at) VALUES (?,?,?,?,?,?)')
            .run('v008-upgrade-project','preserved-v008-project','software','upgrade-fixture',1,new Date(0).toISOString());
          db.close();
          '@
          $seedPath = Join-Path $dataDir 'seed-v008.mjs'
          [System.IO.File]::WriteAllText($seedPath, $seed)
          node $seedPath $database
          $candidateInstaller = Get-ChildItem dist/desktop/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $candidateInstaller.FullName -ArgumentList '/S',"/D=$dest" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Candidate upgrade installer exited $($process.ExitCode)" }
          if ([System.IO.File]::ReadAllText($sentinel) -ne 'preserve-v008-user-data') { throw 'Upgrade did not preserve user data' }
          $candidateExe = Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $candidateExe) { throw 'Upgraded executable not found' }
          $env:RE_DATA_DIR = $dataDir
          $env:RE_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 're-release-upgrade-smoke.json'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $candidateExe.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Upgraded desktop smoke exited $($process.ExitCode)" }
          $result = Get-Content $env:RE_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.version -ne $version) { throw 'Upgraded desktop smoke result mismatch' }
          node --input-type=module -e "import {DatabaseSync} from 'node:sqlite';const db=new DatabaseSync(process.argv[1]);const version=Number(db.prepare('PRAGMA user_version').get().user_version);const row=db.prepare('SELECT name FROM projects WHERE id=?').get('v008-upgrade-project');db.close();if(version!==7||row?.name!=='preserved-v008-project')throw new Error('Schema 7 upgrade or project preservation failed');" $database
          if ($result.gameRevival.genre -ne 'fps' -or -not $result.gameRevival.valid -or $result.gameRevival.errors.Count -ne 0) { throw 'Upgraded Game Revival rebuild smoke failed' }
          if ($result.gameRevival.nodeRuntime -ne 'packaged Electron node.cmd shim' -or $result.gameRevival.npmCli -notlike '*\resources\node_modules\npm\bin\npm-cli.js') { throw 'Upgraded Game Revival smoke did not use packaged npm/Electron' }
          foreach ($check in @('install', 'build', 'unit-tests', 'independent-start')) {
            if (-not ($result.gameRevival.checks | Where-Object { $_.id -eq $check -and $_.passed })) { throw "Upgraded Game Revival smoke missing passing check: $check" }
          }
          if ([System.IO.File]::ReadAllText($sentinel) -ne 'preserve-v008-user-data') { throw 'Upgrade smoke changed preserved user data' }
          @{ previousVersion = '0.0.8'; version = $version; schemaVersion = 7; userDataPreserved = $true; projectPreserved = $true; gameRevival = $result.gameRevival.valid; resourceDir = $result.resourceDir } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 'dist/desktop/windows-upgrade-smoke.json'
      - name: Legacy reconstruction rebuild and independent start smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 're-release-upgrade'
          $exe = Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $exe) { throw 'Upgraded executable not found for Legacy smoke' }
          $resources = Join-Path (Split-Path $exe.FullName) 'resources'
          $work = Join-Path $env:RUNNER_TEMP 're-release-legacy-rebuild'
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $script = Join-Path $work 'legacy-smoke.mjs'
          $output = Join-Path $work 'windows-legacy-smoke.json'
          $source = @'
          import { spawn, spawnSync } from 'node:child_process';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const [resourceDir, root, output] = process.argv.slice(2);
          const packageDir = path.join(resourceDir, 'node_modules', '@reverse', 'legacy-revival');
          const legacy = await import(pathToFileURL(path.join(packageDir, 'dist', 'index.js')).href);
          const sample = path.join(root, 'sample');
          const projectDir = path.join(root, 'rebuilt');
          await mkdir(sample, { recursive: true });
          await writeFile(path.join(sample, 'sample.ini'), '[general]\nname=release-smoke\nenabled=true\n');
          const analysis = await legacy.analyzeLegacySoftware(sample);
          const spec = legacy.createReconstructionSpec({ kind: 'ini-editor', name: 'release-legacy-smoke', requirements: ['read INI', 'export a copy'], profile: analysis.profile });
          const files = await legacy.writeReconstructionProject(legacy.generateReconstructionProject(spec), projectDir);
          const tests = spawnSync(process.execPath, ['--test'], { cwd: projectDir, env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' }, stdio: 'inherit' });
          if (tests.status !== 0) throw new Error('Legacy reconstruction tests failed');
          const server = spawn(process.execPath, ['server.mjs'], { cwd: projectDir, env: { ...process.env, ELECTRON_RUN_AS_NODE: '1', PORT: '4187' }, stdio: ['ignore', 'pipe', 'pipe'] });
          let logs = '';
          server.stdout.on('data', chunk => { logs += String(chunk); });
          server.stderr.on('data', chunk => { logs += String(chunk); });
          let ready = false;
          try {
            for (let attempt = 0; attempt < 40; attempt++) {
              try {
                const response = await fetch('http://127.0.0.1:4187/');
                if (response.ok && (await response.text()).includes('INI')) { ready = true; break; }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 250));
            }
          } finally {
            server.kill();
          }
          if (!ready) throw new Error(`Legacy reconstruction did not start independently: ${logs}`);
          const pkg = JSON.parse(await readFile(path.join(packageDir, 'package.json'), 'utf8'));
          await writeFile(output, JSON.stringify({ version: pkg.version, testsPassed: true, independentStart: true, runtime: process.execPath, projectFiles: files.length }, null, 2) + '\n');
          '@
          [System.IO.File]::WriteAllText($script, $source)
          $previousElectronNode = $env:ELECTRON_RUN_AS_NODE
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            node $script $resources $work $output
            $legacyExitCode = $LASTEXITCODE
            if ($legacyExitCode -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw "Installed Legacy smoke failed (exit=$legacyExitCode)" }
          } finally {
            if ($null -eq $previousElectronNode) { Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue } else { $env:ELECTRON_RUN_AS_NODE = $previousElectronNode }
          }
          Copy-Item $output 'dist/desktop/windows-legacy-smoke.json'
      - name: Silent install smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node scripts/release-atomic.mjs version --root .
          $installer = Get-ChildItem dist/desktop/*.exe | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 're-release-install'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$dest" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $exe = Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable not found' }
          $expectedLauncher = (Get-FileHash 'scripts/ghidra-analyze-headless.mjs' -Algorithm SHA256).Hash
          $launchers = @(Get-ChildItem $dest -Filter 'ghidra-analyze-headless.mjs' -Recurse -File)
          foreach ($pattern in @('\\resources\\scripts\\ghidra-analyze-headless\.mjs$', '\\resources\\node_modules\\scripts\\ghidra-analyze-headless\.mjs$')) {
            $launcher = $launchers | Where-Object { $_.FullName -match $pattern } | Select-Object -First 1
            if (-not $launcher) { throw "Installed Ghidra launcher layout missing: $pattern" }
            if ((Get-FileHash $launcher.FullName -Algorithm SHA256).Hash -ne $expectedLauncher) { throw "Installed Ghidra launcher mismatch: $($launcher.FullName)" }
          }
          $env:RE_DATA_DIR = "$env:RUNNER_TEMP/re-release-data"
          $env:RE_SMOKE_OUTPUT = "$env:RUNNER_TEMP/re-release-smoke.json"
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop smoke exited $($process.ExitCode)" }
          $result = Get-Content $env:RE_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.version -ne $version) { throw 'Desktop smoke result mismatch' }
          if ($result.gameRevival.genre -ne 'fps' -or -not $result.gameRevival.valid -or $result.gameRevival.errors.Count -ne 0) { throw 'Installed Game Revival rebuild smoke failed' }
          if ($result.gameRevival.nodeRuntime -ne 'packaged Electron node.cmd shim' -or $result.gameRevival.npmCli -notlike '*\resources\node_modules\npm\bin\npm-cli.js') { throw 'Installed Game Revival smoke did not use packaged npm/Electron' }
          foreach ($check in @('install', 'build', 'unit-tests', 'independent-start')) {
            if (-not ($result.gameRevival.checks | Where-Object { $_.id -eq $check -and $_.passed })) { throw "Installed Game Revival smoke missing passing check: $check" }
          }
          Copy-Item $env:RE_SMOKE_OUTPUT 'dist/desktop/windows-install-smoke.json'
      - name: Portable smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node scripts/release-atomic.mjs version --root .
          $zip = Get-ChildItem dist/desktop/*.zip | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 're-release-portable'
          Expand-Archive $zip.FullName -DestinationPath $dest
          $exe = Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $exe) { throw 'Portable executable not found' }
          $expectedLauncher = (Get-FileHash 'scripts/ghidra-analyze-headless.mjs' -Algorithm SHA256).Hash
          $launchers = @(Get-ChildItem $dest -Filter 'ghidra-analyze-headless.mjs' -Recurse -File)
          foreach ($pattern in @('\\resources\\scripts\\ghidra-analyze-headless\.mjs$', '\\resources\\node_modules\\scripts\\ghidra-analyze-headless\.mjs$')) {
            $launcher = $launchers | Where-Object { $_.FullName -match $pattern } | Select-Object -First 1
            if (-not $launcher) { throw "Portable Ghidra launcher layout missing: $pattern" }
            if ((Get-FileHash $launcher.FullName -Algorithm SHA256).Hash -ne $expectedLauncher) { throw "Portable Ghidra launcher mismatch: $($launcher.FullName)" }
          }
          $env:RE_DATA_DIR = "$env:RUNNER_TEMP/re-release-portable-data"
          $env:RE_SMOKE_OUTPUT = "$env:RUNNER_TEMP/re-release-portable-smoke.json"
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Portable smoke exited $($process.ExitCode)" }
          $result = Get-Content $env:RE_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.version -ne $version) { throw 'Portable smoke result mismatch' }
          if ($result.gameRevival.genre -ne 'fps' -or -not $result.gameRevival.valid -or $result.gameRevival.errors.Count -ne 0) { throw 'Portable Game Revival rebuild smoke failed' }
          if ($result.gameRevival.nodeRuntime -ne 'packaged Electron node.cmd shim' -or $result.gameRevival.npmCli -notlike '*\resources\node_modules\npm\bin\npm-cli.js') { throw 'Portable Game Revival smoke did not use packaged npm/Electron' }
          foreach ($check in @('install', 'build', 'unit-tests', 'independent-start')) {
            if (-not ($result.gameRevival.checks | Where-Object { $_.id -eq $check -and $_.passed })) { throw "Portable Game Revival smoke missing passing check: $check" }
          }
          Copy-Item $env:RE_SMOKE_OUTPUT 'dist/desktop/windows-portable-smoke.json'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-evidence
          if-no-files-found: error
          path: dist/desktop/windows-*-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-windows
          if-no-files-found: error
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip

  candidate-acceptance:
    needs: [freeze, candidate-linux, candidate-game-docker, candidate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.commit }}
          persist-credentials: false
      - id: meta
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.freeze.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.freeze.outputs.version }}
          EXPECTED_RUN_ID: ${{ needs.freeze.outputs.run_id }}
          LINUX_COMMIT: ${{ needs.candidate-linux.outputs.commit }}
          GAME_DOCKER_COMMIT: ${{ needs.candidate-game-docker.outputs.commit }}
          WINDOWS_COMMIT: ${{ needs.candidate-windows.outputs.commit }}
          LINUX_RUN_ID: ${{ needs.candidate-linux.outputs.run_id }}
          GAME_DOCKER_RUN_ID: ${{ needs.candidate-game-docker.outputs.run_id }}
          WINDOWS_RUN_ID: ${{ needs.candidate-windows.outputs.run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$LINUX_RUN_ID" = "$GITHUB_RUN_ID"
          test "$GAME_DOCKER_RUN_ID" = "$GITHUB_RUN_ID"
          test "$WINDOWS_RUN_ID" = "$GITHUB_RUN_ID"
          test "$LINUX_COMMIT" = "$WINDOWS_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$EXPECTED_COMMIT" = "$LINUX_COMMIT"
          test "$EXPECTED_COMMIT" = "$GAME_DOCKER_COMMIT"
          test "$(node scripts/release-atomic.mjs version --root .)" = "$EXPECTED_VERSION"
          test -z "$(git status --porcelain)"
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: docker-validation
          path: dist/game-docker
      - uses: actions/download-artifact@v8
        with:
          name: windows-smoke-evidence
          path: dist/windows-evidence
      - uses: actions/download-artifact@v8
        with:
          name: v009-evidence
          path: dist/evidence
      - name: Download current-commit dynamic and symbolic evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.freeze.outputs.commit }}
        run: |
          set -euo pipefail
          dynamic_run="$(gh run list --commit "$COMMIT" --workflow dynamic-v009.yml --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .databaseId')"
          symbolic_run="$(gh run list --commit "$COMMIT" --workflow symbolic-v009.yml --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .databaseId')"
          test -n "$dynamic_run"
          test -n "$symbolic_run"
          gh run download "$dynamic_run" -n dynamic-v009-evidence -D dist/evidence/dynamic
          gh run download "$symbolic_run" -n symbolic-v009 -D dist/evidence/symbolic
      - name: Require candidate OpenAPI, real model status and real game Docker reports
        shell: bash
        env:
          COMMIT: ${{ needs.freeze.outputs.commit }}
          VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          set -euo pipefail
          test "$VERSION" = "0.0.9"
          test -s "dist/release/openapi-v$VERSION.json"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const model = JSON.parse(await readFile('dist/evidence/v009-real-model/real-model-report.json', 'utf8'));
          if (model.status !== 'PASSED' || model.realModel?.realModelCalled !== true || model.realModel.requests.length !== 8) throw new Error('Eight-stage real model evidence is required');
          const upgrade = JSON.parse(await readFile('dist/windows-evidence/windows-upgrade-smoke.json', 'utf8'));
          const legacy = JSON.parse(await readFile('dist/windows-evidence/windows-legacy-smoke.json', 'utf8'));
          if (upgrade.version !== process.env.VERSION || upgrade.previousVersion !== '0.0.8' || upgrade.schemaVersion !== 7 || upgrade.userDataPreserved !== true || upgrade.gameRevival !== true) throw new Error('Windows v0.0.8 Schema 7 upgrade evidence is incomplete');
          if (legacy.version !== process.env.VERSION || legacy.independentStart !== true || legacy.testsPassed !== true) throw new Error('Windows Legacy rebuild evidence is incomplete');
          const demos = JSON.parse(await readFile('dist/release/demo-evidence.json', 'utf8'));
          if (demos.version !== process.env.VERSION || demos.legacy?.evidenceStatus !== 'VERIFIED' || demos.legacy?.independentStart !== true || demos.legacy?.testsPassed !== true) throw new Error('Legacy demo evidence is incomplete');
          for (const name of ['pixelknight', 'tron']) if (demos.games?.[name]?.evidenceStatus !== 'VERIFIED' || demos.games?.[name]?.originalClient !== true) throw new Error(`${name} original-client demo evidence is incomplete`);
          const summary = JSON.parse(await readFile('dist/game-docker/docker-validation.json', 'utf8'));
          if (summary.commit !== process.env.COMMIT || summary.version !== process.env.VERSION) throw new Error('Docker evidence identity mismatch');
          for (const genre of ['fps', 'rpg']) {
            const report = JSON.parse(await readFile(`dist/game-docker/${genre}/docker-validation.json`, 'utf8'));
            if (report.targetEvidence?.behavior !== 'VERIFIED' || report.targetEvidence?.originalClient !== 'UNKNOWN' || report.targetEvidence?.protocol !== 'UNKNOWN') throw new Error(`${genre} Docker anti-template evidence must verify behavior while keeping original client and protocol UNKNOWN`);
            if (!report.clients.every(client => client.kind === 'internal-protocol-client' && client.count > 0)) throw new Error(`${genre} Docker anti-template evidence must use only internal protocol clients`);
            if (report.clients.some(client => client.kind === 'original-game-client')) throw new Error(`${genre} Docker template evidence must not claim an original game client`);
            if (JSON.stringify(summary.reports?.[genre]) !== JSON.stringify(report)) throw new Error(`${genre} Docker summary mismatch`);
          }
          NODE
          for genre in fps rpg; do
            node scripts/verify-game-docker-evidence.mjs \
              --genre "$genre" \
              --report "dist/game-docker/$genre/docker-validation.json" \
              --evidence "dist/game-docker/$genre/docker-deployment-evidence.json" \
              --sums "dist/game-docker/$genre/SHA256SUMS.txt"
          done
      - name: Generate independent acceptance and provenance
        shell: bash
        env:
          COMMIT: ${{ needs.freeze.outputs.commit }}
          VERSION: ${{ needs.freeze.outputs.version }}
          TAG: ${{ needs.freeze.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for asset in \
            "reverse-everything-cli-$VERSION.tgz" \
            "reverse-everything-server-$VERSION.tar.gz" \
            "reverse-everything-skill-$VERSION.zip" \
            "Reverse-Everything-Setup-$VERSION-win-x64.exe" \
            "Reverse-Everything-Portable-$VERSION-win-x64.zip" \
            "openapi-v$VERSION.json" \
            "SBOM-v$VERSION.json" \
            "reverse-everything-game-compat-demo-$VERSION.zip" \
            "reverse-everything-legacy-demo-$VERSION.zip" \
            "demo-evidence.json" \
            "docker-image.json"; do
            test -s "dist/release/$asset" || { echo "Missing candidate asset: $asset" >&2; exit 1; }
          done
          node scripts/release-provenance.mjs generate \
            --dir dist/release --commit "$COMMIT" --ref refs/heads/main \
            --version "$VERSION" --tag "$TAG" --run-id "$RUN_ID" --acceptance-run-id "$RUN_ID" \
            --check frozen-main-commit --check linux-quality --check docs-version-skill \
            --check clean-cli-server-skill-smoke --check docker-health --check game-fps-rpg-docker-validation \
            --check windows-install-smoke --check windows-portable-smoke --check windows-game-revival-smoke \
            --check windows-v008-upgrade-smoke --check windows-legacy-revival-smoke \
            --check schema-7-migration --check autopilot-core-api-web-e2e --check mcp-stdio-streamable-http \
            --check real-model-eight-stage --check blind-three-cases --check binary-diff-real --check v009-core-gate \
            --check game-original-client-compat --check legacy-demo-artifact \
            --check server-ghidra-launcher-layout --check desktop-ghidra-launcher-layout \
            --check required-assets-present
          node scripts/release-provenance.mjs verify \
            --dir dist/release --tag "$TAG" --version "$VERSION" \
            --tag-commit "$COMMIT" --skip-tag-check
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          const { COMMIT, VERSION, TAG, RUN_ID } = process.env;
          const manifest = JSON.parse(await readFile('dist/release/RELEASE-MANIFEST.json', 'utf8'));
          const build = JSON.parse(await readFile('dist/release/BUILD-INFO.json', 'utf8'));
          const acceptance = JSON.parse(await readFile('dist/release/ACCEPTANCE.json', 'utf8'));
          const files = (await readdir('dist/release', { withFileTypes: true })).filter(entry => entry.isFile()).map(entry => entry.name).sort();
          const expected = [
            'ACCEPTANCE.json', 'BUILD-INFO.json', 'RELEASE-MANIFEST.json', 'SHA256SUMS.txt', 'docker-image.json',
            `openapi-v${VERSION}.json`, `reverse-everything-cli-${VERSION}.tgz`, `reverse-everything-server-${VERSION}.tar.gz`,
            `reverse-everything-skill-${VERSION}.zip`, `Reverse-Everything-Portable-${VERSION}-win-x64.zip`,
            `Reverse-Everything-Setup-${VERSION}-win-x64.exe`, `SBOM-v${VERSION}.json`,
            `reverse-everything-game-compat-demo-${VERSION}.zip`, `reverse-everything-legacy-demo-${VERSION}.zip`, 'demo-evidence.json',
          ].sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) throw new Error(`Expected exactly 15 Release assets, got ${JSON.stringify(files)}`);
          if (manifest.assets.length !== 13) throw new Error(`Expected 13 manifest assets, got ${manifest.assets.length}`);
          for (const record of [manifest, build, acceptance]) {
            if (record.commit !== COMMIT || record.version !== VERSION) throw new Error('Tag/Build/Acceptance identity mismatch');
          }
          if (TAG !== `v${VERSION}` || manifest.tag !== TAG || manifest.ref !== 'refs/heads/main') throw new Error('Tag or frozen main mismatch');
          if (build.workflowRunId !== RUN_ID || acceptance.runId !== RUN_ID || acceptance.accepted !== true) throw new Error('Build/Acceptance run mismatch');
          NODE
      - name: Assemble and verify v0.0.9 core acceptance
        shell: bash
        env:
          COMMIT: ${{ needs.freeze.outputs.commit }}
        run: |
          set -euo pipefail
          mv dist/evidence/v009-real-model dist/evidence/model
          mkdir -p dist/v009-core-evidence/game
          cp -a dist/evidence/. dist/v009-core-evidence/
          cp dist/release/RELEASE-MANIFEST.json dist/release/SHA256SUMS.txt dist/release/BUILD-INFO.json dist/release/ACCEPTANCE.json dist/v009-core-evidence/
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const demos = JSON.parse(await readFile('dist/release/demo-evidence.json', 'utf8'));
          const cases = ['pixelknight', 'tron'].map(name => ({ name, originalClient: true, passed: demos.games?.[name]?.originalClient === true, evidencePath: 'game/original-client.json' }));
          if (cases.some(item => !item.passed)) throw new Error('Original-client game cases failed');
          await writeFile('dist/v009-core-evidence/game/original-client.json', JSON.stringify({ cases }, null, 2) + '\n');
          NODE
          node scripts/assemble-v009-acceptance.mjs \
            --evidence-dir dist/v009-core-evidence \
            --commit "$COMMIT" \
            --model-report model/real-model-report.json \
            --dynamic-report dynamic/evidence.json \
            --symbolic-report symbolic/evidence.json \
            --binary-diff-report binary-diff/binary-diff-report.json \
            --game-report game/original-client.json
      - uses: actions/upload-artifact@v7
        with:
          name: v009-core-acceptance
          if-no-files-found: error
          path: dist/v009-core-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ needs.freeze.outputs.version }}
          if-no-files-found: error
          path: dist/release/*
      - name: Summarize accepted candidate
        shell: bash
        env:
          COMMIT: ${{ needs.freeze.outputs.commit }}
          TAG: ${{ needs.freeze.outputs.tag }}
        run: |
          {
            echo "## Accepted $TAG candidate"
            echo "- Commit: \`$COMMIT\`"
            echo '- Linux quality, docs/version/Skill checks, clean package smoke and Docker health: passed'
            echo '- Real FPS/RPG Docker deployment evidence: passed'
            echo '- Schema 7 migration, Autopilot core/API/Web E2E and MCP stdio/Streamable HTTP: passed'
            echo '- Real model validation: PASSED, or BLOCKED with missing Key and no model-call claim'
            echo '- Windows installer, v0.0.8 upgrade with preserved data, portable and packaged Legacy/Game Revival rebuild smoke: passed'
            echo '- ACCEPTANCE, BUILD-INFO, RELEASE-MANIFEST and SHA256SUMS: verified'
          } >> "$GITHUB_STEP_SUMMARY"

  tag-draft:
    if: ${{ inputs.publish && inputs.confirmation == format('PUBLISH {0}', needs.freeze.outputs.tag) }}
    needs: [freeze, candidate-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-v009
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.freeze.outputs.tag }}
      version: ${{ needs.freeze.outputs.version }}
      commit: ${{ needs.candidate-acceptance.outputs.commit }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-acceptance.outputs.commit }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v8
        with:
          name: candidate-${{ needs.freeze.outputs.version }}
          path: dist/release
      - name: Verify immutable candidate and annotated Tag
        shell: bash
        env:
          COMMIT: ${{ needs.candidate-acceptance.outputs.commit }}
          VERSION: ${{ needs.freeze.outputs.version }}
          TAG: ${{ needs.freeze.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test -z "$(git status --porcelain)"
          test "$(node scripts/release-atomic.mjs version --root .)" = "$VERSION"
          test "$TAG" = "v$VERSION"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }')"
          if [ -n "$remote_tag" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            remote_tag=local
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$COMMIT" -m "Reverse Everything $TAG"
            remote_tag=local
          fi
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "$TAG^{commit}")" = "$COMMIT"
          node scripts/release-provenance.mjs verify --dir dist/release --tag "$TAG" --version "$VERSION"
          if [ "$remote_tag" = local ]; then git push origin "refs/tags/$TAG"; fi
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "$TAG^{commit}")" = "$COMMIT"
      - name: Create Draft or verify completed Release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.candidate-acceptance.outputs.commit }}
          TAG: ${{ needs.freeze.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs ensure-draft \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$GITHUB_REPOSITORY"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  upload-verify:
    needs: tag-draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-v009
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag-draft.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: candidate-${{ needs.tag-draft.outputs.version }}
          path: dist/release
      - name: Upload missing Draft assets without overwriting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.tag-draft.outputs.commit }}
          TAG: ${{ needs.tag-draft.outputs.tag }}
          RELEASE_ID: ${{ needs.tag-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs upload \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID"
      - name: Verify every Release asset name, size and digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.tag-draft.outputs.commit }}
          TAG: ${{ needs.tag-draft.outputs.tag }}
          RELEASE_ID: ${{ needs.tag-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs verify-draft \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID"

  publish-stable:
    needs: [tag-draft, upload-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-v009
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag-draft.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: candidate-${{ needs.tag-draft.outputs.version }}
          path: dist/release
      - uses: actions/download-artifact@v8
        with:
          name: v009-core-acceptance
          path: dist/v009-core-evidence
      - name: Publish stable latest once and verify the public address
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.tag-draft.outputs.commit }}
          TAG: ${{ needs.tag-draft.outputs.tag }}
          RELEASE_ID: ${{ needs.tag-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs publish \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --core-gate-report dist/v009-core-evidence/V009-CORE-ACCEPTANCE.json \
            --core-gate-evidence-dir dist/v009-core-evidence
      - name: Re-download public assets and verify checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.tag-draft.outputs.commit }}
          TAG: ${{ needs.tag-draft.outputs.tag }}
          RELEASE_ID: ${{ needs.tag-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          node scripts/release-atomic.mjs verify-public \
            --dir dist/release --tag "$TAG" --commit "$COMMIT" --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID"
