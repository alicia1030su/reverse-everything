name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run licenses
      - run: npm test
      - run: npm run test:e2e
      - run: docker compose up -d --build
      - name: Wait for container health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: docker compose down -v
      - name: Build verified source archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v0.0.1"
          git archive --format=tar.gz --prefix="reverse-everything-${TAG}/" -o "reverse-everything-${TAG}.tar.gz" "$TAG"
          sha256sum "reverse-everything-${TAG}.tar.gz" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "reverse-everything-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS --verify-tag --title "逆向万物 ${GITHUB_REF_NAME}" --notes-file docs/development/RELEASE-NOTES.md
