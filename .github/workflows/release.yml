name: Release
on:
  push:
    tags: ['v0.0.2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run licenses
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run test:e2e
      - run: node scripts/generate-openapi.mjs
      - uses: actions/upload-artifact@v4
        with: {name: openapi, path: docs/api/openapi-v0.0.2.json}
  package:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/generate-openapi.mjs
      - run: node scripts/generate-sbom.mjs
      - run: node scripts/package-cli.mjs
      - run: node scripts/package-server.mjs
      - name: Clean CLI install
        run: |
          npm install -g ./dist/release/reverse-everything-cli-0.0.2.tgz --no-audit --no-fund
          reverse-everything --version
          reverse-everything --help
      - name: Clean server extract install and start
        run: |
          mkdir -p /tmp/re-server && tar -xzf dist/release/reverse-everything-server-0.0.2.tar.gz -C /tmp/re-server
          cd /tmp/re-server/server && npm ci --omit=dev --no-audit --no-fund
          RE_DATA_DIR=/tmp/re-server-data npm start >/tmp/re-server.log 2>&1 & echo $! >/tmp/re-server.pid
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/api/health && exit 0; sleep 1; done
          cat /tmp/re-server.log; exit 1
      - uses: actions/upload-artifact@v4
        with: {name: packages, path: dist/release/*.tgz}
      - uses: actions/upload-artifact@v4
        with: {name: server-archive, path: dist/release/*.tar.gz}
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: dist/release/SBOM-v0.0.2.json}
  skill:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: node scripts/validate-skill.mjs
      - run: node scripts/package-skill.mjs
      - run: unzip -q dist/release/reverse-everything-skill-0.0.2.zip -d /tmp/re-skill
      - run: node /tmp/re-skill/reverse-everything/scripts/check-environment.mjs
      - uses: actions/upload-artifact@v4
        with: {name: skill, path: dist/release/*.zip}
  windows-desktop:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run dist -w @reverse/desktop
      - name: Silent install and smoke test
        shell: pwsh
        run: |
          $installer=Get-ChildItem dist/desktop/*.exe | Select-Object -First 1
          $dest="$env:RUNNER_TEMP\re-install"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S","/D=$dest" -Wait
          $exe=Get-ChildItem $dest -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable not found' }
          $env:RE_DATA_DIR="$env:RUNNER_TEMP\re-data"
          $env:RE_SMOKE_OUTPUT="$env:RUNNER_TEMP\re-smoke.json"
          Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -Wait
          Get-Content $env:RE_SMOKE_OUTPUT
          if (-not (Select-String -Path $env:RE_SMOKE_OUTPUT -Pattern '"ok": true')) { throw 'Desktop smoke failed' }
      - name: Portable smoke test
        shell: pwsh
        run: |
          $zip=Get-ChildItem dist/desktop/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\re-portable"
          $exe=Get-ChildItem "$env:RUNNER_TEMP\re-portable" -Filter *.exe -Recurse | Where-Object { $_.Name -like '*Reverse Everything*' } | Select-Object -First 1
          $env:RE_DATA_DIR="$env:RUNNER_TEMP\re-portable-data"
          $env:RE_SMOKE_OUTPUT="$env:RUNNER_TEMP\re-portable-smoke.json"
          Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -Wait
          Get-Content $env:RE_SMOKE_OUTPUT
      - uses: actions/upload-artifact@v4
        with: {name: windows-desktop, path: dist/desktop/*.exe}
      - uses: actions/upload-artifact@v4
        with: {name: windows-portable, path: dist/desktop/*.zip}
  docker:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: |
        for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173/api/health; then exit 0; fi; sleep 2; done
        docker compose logs; exit 1
      - run: docker compose down -v
  release:
    if: startsWith(github.ref, 'refs/tags/v0.0.2')
    needs: [package, skill, windows-desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - name: Checksums
        run: |
          cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 逆向万物 ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: docs/development/V002-RELEASE-NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
