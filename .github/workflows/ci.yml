name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run licenses
      - run: npm test
      - run: npm run test:e2e
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify Web console
        run: curl -fsS http://127.0.0.1:4173/ | grep -q '逆向万物'
      - name: Verify CLI inside container
        run: docker compose exec -T reverse-everything node apps/cli/dist/cli.js health
      - run: docker compose down -v
