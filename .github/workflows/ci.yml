name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run docs:check
      - run: npm run defects:check
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run licenses
      - run: npm test -- --reporter=json --outputFile=.artifacts/vitest-${{ matrix.os }}.json
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-${{ matrix.os }}
          path: .artifacts/vitest-${{ matrix.os }}.json
          if-no-files-found: ignore
      - name: Enforce historical skip coverage and required safety tests
        run: node scripts/check-skip-coverage.mjs --platform ${{ matrix.os }} --report .artifacts/vitest-${{ matrix.os }}.json
      - name: Require Legacy unit tests
        run: npx vitest run tests/unit/legacy-revival.test.ts --reporter=verbose
      - name: Require anti-template game behavior tests
        run: npx vitest run tests/unit/game-revival.test.ts -t "evidence-driven anti-template acceptance" --reporter=verbose
      - name: Require Schema 6 migration tests
        run: npx vitest run tests/unit/backup.test.ts -t "schema 4 plan binding migration integrity|schema 3 migration integrity" --reporter=verbose
      - run: npm run test:e2e
      - name: Require real original-client game compatibility evidence
        run: node --input-type=module -e "import {readFile} from 'node:fs/promises';for(const name of ['pixelknight','tron']){const value=JSON.parse(await readFile('artifacts/v007-game-compat/'+name+'.json','utf8'));if(value.evidenceStatus!=='VERIFIED'||value.originalClient!==true)throw new Error(name+' evidence missing')}"
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify Web console
        run: curl -fsS http://127.0.0.1:4173/ | grep -q '逆向万物'
      - name: Verify CLI inside container
        run: docker compose exec -T reverse-everything node apps/cli/dist/cli.js health
      - run: docker compose down -v
  game-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        genre: [fps, rpg]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Generate and validate ${{ matrix.genre }} with Docker Compose
        run: node scripts/validate-game-docker.mjs --genre ${{ matrix.genre }}
      - name: Independently verify ${{ matrix.genre }} Docker evidence
        run: |
          node scripts/verify-game-docker-evidence.mjs \
            --genre ${{ matrix.genre }} \
            --report .artifacts/game-docker-${{ matrix.genre }}/docker-validation.json \
            --evidence .artifacts/game-docker-${{ matrix.genre }}/docker-deployment-evidence.json \
            --sums .artifacts/game-docker-${{ matrix.genre }}/SHA256SUMS.txt
      - name: Upload Docker validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-docker-${{ matrix.genre }}
          path: |
            .artifacts/game-docker-${{ matrix.genre }}/docker-validation.json
            .artifacts/game-docker-${{ matrix.genre }}/docker-deployment-evidence.json
            .artifacts/game-docker-${{ matrix.genre }}/SHA256SUMS.txt
          if-no-files-found: error
