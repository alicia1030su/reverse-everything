name: Model Access Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List accessible model identifiers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REAL_MODEL_BASE_URL: ${{ vars.REAL_MODEL_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          test -n "${REAL_MODEL_BASE_URL:-}"
          response="$(curl -fsS --max-time 30 -H "Authorization: Bearer ${OPENAI_API_KEY}" "${REAL_MODEL_BASE_URL%/}/models")"
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);const ids=(v.data??v.models??[]).map(x=>x.id??x.name).filter(Boolean);console.log(JSON.stringify({count:ids.length,models:ids},null,2));if(!ids.length)process.exit(2);});"
