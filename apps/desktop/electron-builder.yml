appId: com.alicia1030su.reverse-everything
productName: Reverse Everything
electronDist: ../../node_modules/electron/dist
npmRebuild: false
directories:
  output: ../../dist/desktop
  buildResources: build
files:
  - dist/**/*
extraResources:
  - from: ../../apps/api/dist
    to: apps/api/dist
  - from: ../../apps/worker/dist
    to: apps/worker/dist
  - from: ../../apps/web/dist
    to: apps/web/dist
  - from: ../../packages
    to: packages
    filter: ['**/dist/**','**/package.json']
  - from: ../../dist/desktop-runtime/node_modules
    to: node_modules
  - from: ../../dist/desktop-runtime/scripts
    to: scripts
  - from: ../../examples
    to: examples
  - from: ../../scripts/start.mjs
    to: scripts/start.mjs
  - from: ../../docs/api
    to: docs/api
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
win:
  signAndEditExecutable: false
  artifactName: Reverse-Everything-Setup-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Reverse Everything
compression: maximum
